[package]
workspace = "../.."
name = "rutis-agent"
description = "Minimal agent framework on rutis five pillars: aimux LanguageModel service, ToolRegistry + AgentDriver plugins, in-memory session, streaming turns"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["llm", "agent", "ai", "coding-agent", "tui"]
categories = ["asynchronous", "development-tools"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
aimux-core = "0.3.0"
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.34"
async-stream = "0.3.6"
async-trait = "0.1.92"
# rutui 锁 ratatui 0.29 / crossterm 0.28,且在公共 API 暴露这些类型,
# 因此消费者必须对齐版本。设计见 docs/design-rutui-rewrite-2026-08-23.md §六。
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
# 选区取文本时需按 unicode 宽度跳过 CJK 宽字符的尾格;对齐 ratatui-core 的版本。
unicode-width = { version = "0.2", optional = true }
rutui-core = { version = "0.1.0", optional = true }
rutui-prompt = { version = "0.1.0", optional = true }
rutui-theme = { version = "0.1.0", optional = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width", "dep:rutui-core", "dep:rutui-prompt", "dep:rutui-theme"]

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "tui_scripted"
required-features = ["tui"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aimux-providers = "0.3.0"
