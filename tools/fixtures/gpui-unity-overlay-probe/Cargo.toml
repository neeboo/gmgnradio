[package]
name = "gmgn-gpui-overlay-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a", features = ["gpui-fast"] }
gpui_macos = { package = "gpui-fast-macos", version = "=0.1.2" }
anyhow = "1"
futures = "0.3"
raw-window-handle = "0.6"
gmgn-gpui-ui = { path = "../../../apps/gpui-ui" }
serde_json = "=1.0.151"

# The panel-geometry tests lay the real shell out in a real (headless) GPUI
# window and read the prepared boxes back (`TestAppContext` / `try_find`), which
# is what `test-support` carries. It is a **dev**-dependency: the shipped
# `cdylib` keeps its own feature set (resolver 3), so nothing the host mounts
# changes.
[dev-dependencies]
image = { version = "=0.25.10", default-features = false }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a", features = ["gpui-fast", "test-support"] }

# 逐屏视觉对照: the real `MediaPane` (电视 and 音乐与节目 sections) painted at the
# overlay panel's own 590×458 through GPUI's headless Metal renderer. GPUI's
# macOS platform must be created on the main thread, so `harness = false`.
[[test]]
name = "media_panels_shot"
harness = false
