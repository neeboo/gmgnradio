[package]
name = "gmgn-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Transport-independent wire envelopes shared by gmgn services"

[dependencies]
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
