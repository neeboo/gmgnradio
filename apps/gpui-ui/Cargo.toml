[package]
name = "gmgn-gpui-ui"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a", features = ["gpui-fast"] }
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false }
base64 = "=0.22.1"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a", features = ["gpui-fast", "test-support"] }

# GPUI's macOS backend must run on the main thread, so the screenshot harness is
# a `harness = false` binary test: it renders the real panes and asserts that they
# painted visible content (and writes a PNG when GMGN_SHOTS_DIR is set).
[[test]]
name = "ui_shots"
harness = false

# The same treatment for 「我的物件」: the reworked ResidentPropEditorPane is
# rendered — the merged list with the world's own devices, and the device
# selection — so the panel can be looked at even when no lab app can be launched.
[[test]]
name = "props_pane_shot"
harness = false

# The transport bar's 音量 popover: the bar's real prepared-layout rect and the
# pixels the open popover actually paints. GPUI's macOS platform must be created
# on the main thread, so this is a `harness = false` binary test too.
[[test]]
name = "transport_popover_geometry"
harness = false

# 「我的物件」's 「还有 N 件」 control: the panel's real prepared-layout rect and
# every delivered row's real visible flag in a viewport-sized shell, before and
# after the control is clicked. GPUI's macOS platform must run on the main
# thread, so this is a `harness = false` binary test too.
[[test]]
name = "props_remaining_toggle"
harness = false

# The 「歌单 · N」 program rail as pixels: the real `StageProgramRailPane` at its
# own 350×430 with a 62-item catalog, so the panel the person complained about
# (「顶部一大片空白、内容挤在下半屏」) can be looked at without a device.
[[test]]
name = "program_rail_shot"
harness = false

# 小窗's chat as pixels: the real `ResidentChatPane` in the original's compact
# chat column (`.compact-window .chat-column`, `Player.uss:102`) inside a headless
# 224×336 window, so "点聊天就切回大窗" has a picture that shows the chat **in**
# the compact window — message list and input — plus a real-layout check that the
# input is never pushed out of it. GPUI's macOS platform must run on the main
# thread, so this is a `harness = false` binary test too.
[[test]]
name = "compact_chat_shot"
harness = false

# 启动加载态**作为像素**：真 `StartupGatePane` 在无头窗口里渲染出的「准备中」（步骤名
# + `n/m 项已就绪` + 进度条，**没有**重试）与「卡住」（具名失败 + 重试 + 进门后按需的
# 具名列表）两帧，外加"全部就绪后加载态必须让位"的判据。GPUI 的 macOS 平台必须在主
# 线程创建，所以这也是 `harness = false`。
[[test]]
name = "startup_gate_shot"
harness = false

