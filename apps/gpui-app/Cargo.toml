[package]
name = "gmgn-gpui-app"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
gpui-kit = "=0.7.0"
gmgn-gpui-ui = { path = "../gpui-ui" }
raw-window-handle = "0.6"
image = { version = "=0.25.10", default-features = false }
serde_json = "=1.0.151"
rust-embed = { version = "=8.12.0", features = ["debug-embed"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }

[build-dependencies]
cc = "1"
