[package]
name = "gmgn-gpui-app"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a", features = ["gpui-fast"] }
gmgn-gpui-ui = { path = "../gpui-ui" }
raw-window-handle = "0.6"
image = { version = "=0.25.10", default-features = false }
serde_json = "=1.0.151"
rust-embed = { version = "=8.12.0", features = ["debug-embed"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }

[build-dependencies]
cc = "1"
