name: GMGNRadio
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 79J6W8QEMD
packages:
  NanoemCore:
    path: Packages/NanoemCore
  MMDSceneKit:
    path: Packages/MMDSceneKit
  WorldRuntime:
    path: Packages/WorldRuntime
  MotionDistribution:
    path: Packages/MotionDistribution
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 3.2.2
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.15.3
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter.git
    exactVersion: 1.0.1
  VRMMetalKit:
    url: https://github.com/arkavo-org/VRMMetalKit.git
    exactVersion: 1.0.0
targets:
  GMGNRadio:
    type: application
    platform: macOS
    sources:
      - Sources/GMGNRadio
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/MMDMotions
        buildPhase: resources
        type: folder
      - path: Resources/Worlds
        buildPhase: resources
        type: folder
    dependencies:
      - package: NanoemCore
        product: CNanoem
      - package: MMDSceneKit
        product: MMDSceneKit
      - package: WorldRuntime
        product: WorldRuntime
      - package: MotionDistribution
        product: MotionDistribution
      - package: ElevenLabs
      - package: LiveKit
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
      - package: VRMMetalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gmgn.radio
        PRODUCT_MODULE_NAME: GMGNRadio
        PRODUCT_NAME: gmgn radio
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GMGNRadio.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        DEVELOPMENT_TEAM: 79J6W8QEMD
        ENABLE_HARDENED_RUNTIME: YES
  GMGNRadioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GMGNRadioTests
    dependencies:
      - target: GMGNRadio
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        DEVELOPMENT_TEAM: 79J6W8QEMD
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/gmgn radio.app/Contents/MacOS/gmgn radio"
schemes:
  GMGNRadio:
    build:
      targets:
        GMGNRadio: all
        GMGNRadioTests: [test]
    test:
      targets:
        - GMGNRadioTests
